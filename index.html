<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markets in Milan - Your Guide to Local Markets</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="header-left">
                <div class="logo">LOGO</div>
            </div>
            <div class="header-center">
                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="Search markets..." class="search-input" autocomplete="off">
                    <button class="search-btn" aria-label="Search">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>
                            <path d="m21 21-4.35-4.35"></path>
                        </svg>
                    </button>
                    <div class="search-suggestions" id="searchSuggestions" aria-label="Search suggestions"></div>
                </div>
            </div>
            <div class="header-right">
                <div class="header-icons">
                    <button class="icon-btn" aria-label="Favorites">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5c0-2.49 2.01-4.5 4.5-4.5 1.54 0 3.04.56 4.5 1.69 1.46-1.13 2.96-1.69 4.5-1.69 2.49 0 4.5 2.01 4.5 4.5 0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                        </svg>
                    </button>
                    <button class="icon-btn" aria-label="User profile">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                        </svg>
                    </button>
                </div>
                <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <div class="container">
        <!-- Sidebar with Filters -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-content">
                <h3 class="filter-title">LOCATION</h3>
                <div class="filter-group" id="locationFilter">
                    <!-- Populated by JS -->
                </div>

                <h3 class="filter-title">MARKET TYPE</h3>
                <div class="filter-group" id="marketTypeFilter">
                    <!-- Populated by JS -->
                </div>

                <h3 class="filter-title">PRODUCTS</h3>
                <div class="filter-group" id="productFilter">
                    <!-- Populated by JS -->
                </div>

                <button class="clear-filters-btn" id="clearFiltersBtn">Clear Filters</button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Map Section -->
            <div class="map-section">
                <div id="map" class="map-container"></div>
            </div>

            <!-- Cards Grid Section -->
            <section class="cards-section">
                <h2 class="section-title">Markets</h2>
                <div class="cards-grid" id="cardsGrid">
                    <!-- Market cards populated by JS -->
                </div>
                <div class="no-results" id="noResults" style="display: none;">
                    <p>No markets found matching your filters.</p>
                </div>
            </section>
        </main>
    </div>

    <!-- Overlay for sidebar on mobile -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Scripts -->
        <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
    
    
</body>
</html>
